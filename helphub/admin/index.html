<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HelpHub Admin Dashboard | Moderation & Control Center</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .admin-header {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 24px;
    }
    .stat-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }
    .stat-box b {
      display: block;
      font: 800 32px "Plus Jakarta Sans", sans-serif;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .stat-box p {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }
    .admin-table-container {
      margin-top: 45px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 26px;
      box-shadow: var(--shadow-sm);
    }
    .request-action-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    @media (max-width: 900px) {
      .admin-stats-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    @media (max-width: 600px) {
      .admin-stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../">
      <span class="brand-mark">❤</span>
      <span>Help<span>Hub</span> <small style="font-size:12px; background:var(--primary-light); color:var(--primary); padding:3px 8px; border-radius:6px; margin-left:6px;">ADMIN</small></span>
    </a>
    <div class="nav-actions">
      <a href="../" class="btn btn-outline">← Back to Website</a>
      <button class="btn btn-outline" id="themeBtn">☾</button>
      <button class="btn btn-primary" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="section">
    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px;">
      <div>
        <span class="eyebrow">ADMIN • CONTROL CENTER</span>
        <h1>Platform Overview</h1>
      </div>
      <button class="btn btn-soft" id="refreshBtn">↻ Refresh Data</button>
    </div>

    <!-- Stats Grid -->
    <div class="admin-stats-grid" id="statsGrid">
      <div class="stat-box">
        <b id="statUsers">-</b>
        <p>Registered Community Users</p>
      </div>
      <div class="stat-box">
        <b id="statHelpRequests">-</b>
        <p>Total Help Requests</p>
      </div>
      <div class="stat-box">
        <b id="statVolunteers">-</b>
        <p>Active Volunteers</p>
      </div>
      <div class="stat-box">
        <b id="statDonations">-</b>
        <p>Total Funds Donated</p>
      </div>
    </div>

    <!-- Requests Verification Panel -->
    <div class="admin-table-container">
      <div class="section-head" style="margin-bottom:20px;">
        <div>
          <h2>Manage Help Requests</h2>
          <p style="color:var(--muted); font-size:14px;">Review submissions, verify legitimacy, or decline unverified requests.</p>
        </div>
      </div>
      <div id="requestsList" class="request-list">
        <div style="text-align:center; padding:30px; color:var(--muted);">Loading requests...</div>
      </div>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    const $ = s => document.querySelector(s);
    const STORAGE_USER = 'helphub_user';
    const STORAGE_REQUESTS = 'helphub_requests';
    const STORAGE_VOLUNTEERS = 'helphub_volunteers';
    const STORAGE_DONATIONS = 'helphub_donations';

    function toast(m) {
      const t = $("#toast");
      if (!t) return;
      t.textContent = m;
      t.style.transform = "translateY(0)";
      setTimeout(() => { t.style.transform = "translateY(140px)"; }, 2800);
    }

    // Theme initialization
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
      $("#themeBtn").textContent = "☀";
    }
    $("#themeBtn").onclick = () => {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      $("#themeBtn").textContent = isDark ? "☀" : "☾";
    };

    // Generic API call with fallback to mock data
    async function api(u, o = {}) {
      try {
        let r = await fetch(u, {
          ...o,
          headers: { 'Accept': 'application/json', ...(o.headers || {}) }
        });
        const contentType = r.headers.get("content-type");
        if (contentType && contentType.includes("application/json")) {
          let d = await r.json();
          if (!r.ok) throw Error(d.message || 'Error');
          return d;
        } else {
          throw new Error("Server offline");
        }
      } catch (e) {
        // Mock fallback for Admin
        if (u.includes('action=stats')) {
          const reqs = JSON.parse(localStorage.getItem(STORAGE_REQUESTS) || '[]');
          const vols = JSON.parse(localStorage.getItem(STORAGE_VOLUNTEERS) || '[]');
          const dons = JSON.parse(localStorage.getItem(STORAGE_DONATIONS) || '[]');
          const totalDonated = dons.reduce((sum, d) => sum + Number(d.amount || 0), 840000);
          return {
            success: true,
            stats: {
              users: 1248,
              help_requests: reqs.length || 4,
              volunteers: 1840 + vols.length,
              donated: totalDonated
            }
          };
        }
        if (u.includes('action=requests')) {
          const reqs = JSON.parse(localStorage.getItem(STORAGE_REQUESTS) || '[]');
          return { success: true, data: reqs };
        }
        if (u.includes('action=set_request')) {
          const id = (o.body instanceof FormData) ? o.body.get('id') : null;
          const status = (o.body instanceof FormData) ? o.body.get('status') : null;
          const reqs = JSON.parse(localStorage.getItem(STORAGE_REQUESTS) || '[]');
          const target = reqs.find(r => r.id == id);
          if (target) {
            target.status = status;
            localStorage.setItem(STORAGE_REQUESTS, JSON.stringify(reqs));
          }
          return { success: true };
        }
        return { success: true };
      }
    }

    async function loadDashboard() {
      try {
        // Load stats
        let statsRes = await api('../api/admin.php?action=stats');
        if (statsRes && statsRes.stats) {
          const x = statsRes.stats;
          $("#statUsers").textContent = Number(x.users || 0).toLocaleString();
          $("#statHelpRequests").textContent = Number(x.help_requests || 0).toLocaleString();
          $("#statVolunteers").textContent = Number(x.volunteers || 0).toLocaleString();
          $("#statDonations").textContent = "₹" + Number(x.donated || 0).toLocaleString('en-IN');
        }

        // Load requests
        let reqsRes = await api('../api/admin.php?action=requests');
        const container = $("#requestsList");
        const list = reqsRes.data || [];

        if (list.length === 0) {
          container.innerHTML = '<div class="request-item" style="justify-content:center;">No help requests found in database.</div>';
          return;
        }

        container.innerHTML = list.map(r => {
          const statusClass = r.status === 'verified' ? 'status-verified' : (r.status === 'rejected' ? 'status-rejected' : 'status-pending');
          const statusLabel = r.status ? r.status.toUpperCase() : 'PENDING';

          return `
            <div class="request-item">
              <div class="request-item-content">
                <div style="display:flex; gap:8px; align-items:center;">
                  <span class="tag">${r.category}</span>
                  <span class="status-badge ${statusClass}">${statusLabel}</span>
                </div>
                <h4 style="margin-top:6px;">${r.title}</h4>
                <p><strong>${r.requester || 'Requester'}</strong> (${r.email || 'user@helphub.org'}) • ${r.location} • Target: ₹${Number(r.target_amount || 0).toLocaleString('en-IN')}</p>
                <p style="font-size:13px; color:var(--muted);">${r.description}</p>
              </div>
              <div class="request-action-group">
                <button class="btn btn-success" onclick="setStatus(${r.id}, 'verified')">✓ Verify</button>
                <button class="btn btn-danger" onclick="setStatus(${r.id}, 'rejected')">✕ Reject</button>
                <button class="btn btn-outline" onclick="setStatus(${r.id}, 'pending')">Reset</button>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        toast(e.message || "Error loading dashboard");
      }
    }

    async function setStatus(id, status) {
      let fd = new FormData();
      fd.append('id', id);
      fd.append('status', status);

      try {
        await api('../api/admin.php?action=set_request', {
          method: 'POST',
          body: fd
        });
        toast(`Request #${id} marked as ${status}`);
        loadDashboard();
      } catch (e) {
        toast(e.message || "Failed to update status");
      }
    }

    $("#refreshBtn").onclick = loadDashboard;
    $("#logoutBtn").onclick = async () => {
      try {
        await api('../api/auth.php?action=logout');
      } catch (e) {}
      localStorage.removeItem(STORAGE_USER);
      location.href = '../';
    };

    loadDashboard();
  </script>
</body>
</html>
